name: Club MN NFC - Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "v6" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer la plateforme Android
        run: flutter create --platforms=android --org fr.montchanin.clubnage .

      - name: Supprimer le test Flutter par défaut
        run: rm -f test/widget_test.dart

      - name: Configurer le NFC Android et le logo
        shell: bash
        run: |
          python3 tool/prepare_android.py
          cp -R tool/android_icons/. android/app/src/main/res/

      - name: Vérifier et récupérer les dépendances
        run: |
          flutter --version
          flutter pub get
          flutter analyze

      - name: Construire l'APK de test
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Club-MN-NFC-V6-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
