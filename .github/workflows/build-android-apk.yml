name: Club MN NFC - Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "v6", "v7", "v7.13-corrections", "v7.14-corrections", "v7.15-synchronisation-badges", "v7.16-corrections", "v7.18-creneaux", "v7.19-synchronisation", "v7.20-production", "v7.21-signature" ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer la plateforme Android
        run: flutter create --platforms=android --org fr.montchanin.clubnage .

      - name: Configurer la signature de production Android
        shell: bash
        env:
          CLUBNAGE_KEYSTORE_BASE64: ${{ secrets.CLUBNAGE_KEYSTORE_BASE64 }}
          CLUBNAGE_STORE_PASSWORD: ${{ secrets.CLUBNAGE_STORE_PASSWORD }}
          CLUBNAGE_KEY_ALIAS: ${{ secrets.CLUBNAGE_KEY_ALIAS }}
          CLUBNAGE_KEY_PASSWORD: ${{ secrets.CLUBNAGE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CLUBNAGE_KEYSTORE_BASE64 CLUBNAGE_STORE_PASSWORD CLUBNAGE_KEY_ALIAS CLUBNAGE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERREUR : secret GitHub $name manquant. Aucune APK non signée ne sera publiée."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/clubnage-release.jks"
          printf '%s' "$CLUBNAGE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$CLUBNAGE_STORE_PASSWORD" \
            -alias "$CLUBNAGE_KEY_ALIAS" >/dev/null
          python3 tool/configure_release_signing.py
          echo "Signature de production configurée ; la clé reste hors du dépôt."

      - name: Supprimer le test Flutter par défaut
        run: rm -f test/widget_test.dart

      - name: Configurer le NFC Android et le logo
        shell: bash
        run: |
          python3 tool/prepare_android.py
          cp -R tool/android_icons/. android/app/src/main/res/

      - name: Diagnostic OAuth2 Android
        shell: bash
        run: |
          echo "===== MANIFESTE ANDROID ====="
          cat android/app/src/main/AndroidManifest.xml
          echo "===== CONFIGURATION GRADLE ====="
          grep -n -C 5 'appAuthRedirectScheme' android/app/build.gradle.kts || true
          echo "===== CONFIGURATION APP AUTH ====="
          grep -R -n -E 'AuthorizationManagementActivity|RedirectUriReceiverActivity|launchMode|taskAffinity' android/app/src/main 2>/dev/null || true

      - name: Vérifier et récupérer les dépendances
        run: |
          flutter --version
          flutter pub get
          flutter analyze
          flutter test test/local_attendance_store_test.dart test/attendance_v711_test.dart test/slot_authorization_test.dart

      - name: Corriger le SDK Android du module OAuth
        run: |
          python3 - <<'PATCH'
          from pathlib import Path
          import re
          files = list(Path.home().glob('.pub-cache/hosted/pub.dev/flutter_appauth-*/android/build.gradle'))
          if len(files) != 1:
              raise SystemExit(f'Module OAuth introuvable : {files}')
          p = files[0]
          s = p.read_text()
          patterns = [
              r'compileSdkVersion\s+33\b',
              r'compileSdk\s*(?:=\s*)?33\b',
          ]
          updated = s
          for pattern in patterns:
              updated, n = re.subn(pattern, 'compileSdk 36', updated, count=1)
              if n:
                  break
          if updated == s:
              raise SystemExit('SDK 33 introuvable dans flutter_appauth : vérifier la configuration Gradle')
          p.write_text(updated)
          print('SDK OAuth corrigé vers 36')
          PATCH

      - name: Construire l'APK de production signé
        env:
          CLUBNAGE_KEYSTORE_PATH: ${{ runner.temp }}/clubnage-release.jks
          CLUBNAGE_STORE_PASSWORD: ${{ secrets.CLUBNAGE_STORE_PASSWORD }}
          CLUBNAGE_KEY_ALIAS: ${{ secrets.CLUBNAGE_KEY_ALIAS }}
          CLUBNAGE_KEY_PASSWORD: ${{ secrets.CLUBNAGE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-name=7.21.0 --build-number="$BUILD_NUMBER"

      - name: Contrôler la signature et la version de l'APK
        shell: bash
        env:
          CLUBNAGE_STORE_PASSWORD: ${{ secrets.CLUBNAGE_STORE_PASSWORD }}
          CLUBNAGE_KEY_ALIAS: ${{ secrets.CLUBNAGE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -m1 '^package:'
          KEY_FINGERPRINT="$(keytool -list -v -keystore "$RUNNER_TEMP/clubnage-release.jks" -storepass "$CLUBNAGE_STORE_PASSWORD" -alias "$CLUBNAGE_KEY_ALIAS" | grep 'SHA256:' | head -1 | tr -d ' :')"
          APK_FINGERPRINT="$("$APKSIGNER" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest:' | head -1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')"
          test -n "$KEY_FINGERPRINT" && test -n "$APK_FINGERPRINT"
          case "$KEY_FINGERPRINT" in *"$APK_FINGERPRINT"*) echo 'Certificat de production confirmé.' ;; *) echo 'ERREUR : certificat APK différent de la clé de production.'; exit 1 ;; esac

      - name: Diagnostic manifeste fusionné OAuth2
        shell: bash
        run: |
          echo "===== MANIFESTES FUSIONNÉS ====="
          find build/app/intermediates -type f -name AndroidManifest.xml | while read -r f; do
            echo "===== $f ====="
            grep -n -C 8 -E 'AuthorizationManagementActivity|RedirectUriReceiverActivity|MainActivity|appAuthRedirectScheme|taskAffinity|launchMode' "$f" || true
          done

      - name: Nommer l'APK selon la version
        shell: bash
        run: |
          VERSION=$(echo "${GITHUB_REF_NAME}" | grep -oE 'v[0-9]+[.][0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "ERREUR : version introuvable dans la branche"
            exit 1
          fi
          VERSION="V${VERSION#v}"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ClubNage-NFC_${VERSION}.apk"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ClubNage-NFC_${{ env.APK_VERSION }}
          path: build/app/outputs/flutter-apk/ClubNage-NFC_*.apk
          if-no-files-found: error
          retention-days: 30
